<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">吊塔整体静力手算自由体平衡</title>
  <desc id="desc">把塔身简化为悬臂柱，顶部有竖向吊重 W 和水平力 P，沿高度有自重 q，基础承受轴向力、剪力和弯矩。</desc>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1565c0"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef6c00"/></marker>
  </defs>
  <rect width="1300" height="760" fill="#f8fafc"/>
  <text x="650" y="56" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#102a43">先用整体平衡校核 Mechanical 反力</text>

  <!-- free body -->
  <line x1="500" y1="590" x2="500" y2="150" stroke="#455a64" stroke-width="28"/>
  <line x1="410" y1="590" x2="590" y2="590" stroke="#263238" stroke-width="18"/>
  <path d="M430 600 L430 670 M485 600 L485 670 M540 600 L540 670" stroke="#546e7a" stroke-width="8"/>
  <line x1="400" y1="670" x2="600" y2="670" stroke="#263238" stroke-width="12"/>
  <text x="500" y="712" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#37474f">基础 / 锚栓固定端（教学简图）</text>

  <line x1="500" y1="150" x2="500" y2="285" stroke="#c62828" stroke-width="10" marker-end="url(#red)"/>
  <text x="535" y="250" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#c62828">W</text>
  <line x1="280" y1="170" x2="500" y2="170" stroke="#1565c0" stroke-width="10" marker-end="url(#blue)"/>
  <text x="305" y="145" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#1565c0">P</text>
  <line x1="475" y1="235" x2="475" y2="555" stroke="#2e7d32" stroke-width="7" stroke-dasharray="15 10" marker-end="url(#green)"/>
  <text x="300" y="390" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#2e7d32">q（塔身自重）</text>
  <line x1="500" y1="150" x2="620" y2="150" stroke="#455a64" stroke-width="3" marker-end="url(#orange)"/>
  <line x1="500" y1="590" x2="500" y2="150" stroke="#455a64" stroke-width="3" marker-end="url(#orange)"/>
  <text x="650" y="145" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#37474f">H</text>
  <path d="M575 520 A 85 85 0 0 0 485 605" fill="none" stroke="#ef6c00" stroke-width="7" marker-end="url(#orange)"/>
  <text x="600" y="570" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#ef6c00">基础弯矩</text>

  <!-- reactions -->
  <line x1="500" y1="590" x2="320" y2="590" stroke="#1565c0" stroke-width="9" marker-end="url(#blue)"/>
  <text x="250" y="596" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#1565c0">HB = P</text>
  <line x1="500" y1="590" x2="500" y2="710" stroke="#c62828" stroke-width="9" marker-end="url(#red)"/>
  <text x="525" y="700" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#c62828">VB = W + qH</text>

  <!-- equations -->
  <rect x="760" y="120" width="470" height="500" rx="22" fill="#fff8e1" stroke="#ffb300" stroke-width="3"/>
  <text x="995" y="165" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#7a4d00">整体平衡（符号按右手定则）</text>
  <text x="800" y="225" font-family="Consolas, Microsoft YaHei, monospace" font-size="23" fill="#3e2723">ΣFx = 0  →  HB = P</text>
  <text x="800" y="275" font-family="Consolas, Microsoft YaHei, monospace" font-size="23" fill="#3e2723">ΣFz = 0  →  VB = W + qH</text>
  <text x="800" y="330" font-family="Consolas, Microsoft YaHei, monospace" font-size="23" fill="#3e2723">ΣMbase = 0</text>
  <text x="800" y="375" font-family="Consolas, Microsoft YaHei, monospace" font-size="23" fill="#3e2723">MB = P·H + q·H²/2 + ΣMj</text>
  <text x="800" y="435" font-family="Consolas, Microsoft YaHei, monospace" font-size="23" fill="#3e2723">e = MB / VB</text>
  <text x="800" y="485" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#4e342e">e 用于检查合力是否落在基础/锚栓区域内</text>
  <text x="800" y="535" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#4e342e">ΣMj 需把偏心吊重、臂架、风和机构力矩逐项换算</text>
  <text x="800" y="585" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#b71c1c">这是整体手算，不是地基承载力或锚栓设计</text>

  <text x="650" y="735" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#455a64">Mechanical 的 Reaction Force 应逐工况与上式对照；偏差要查反力约束、连接和单位。</text>
</svg>
