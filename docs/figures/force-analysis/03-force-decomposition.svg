<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Fluent 表面总力的压力与黏性分解</title>
  <desc id="desc">流体作用在物体壁面上的总力等于压力力和壁面黏性剪切力之和。</desc>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1565c0"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#ef6c00"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6a1b9a"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#fafafa"/>
  <text x="600" y="58" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#263238">总力 = 压力力 + 壁面黏性力</text>
  <rect x="65" y="110" width="720" height="520" rx="20" fill="#eaf4fb" stroke="#64b5f6" stroke-width="3"/>
  <path d="M300 210 C455 270 455 490 300 550 L520 550 C675 490 675 270 520 210 Z" fill="#eceff1" stroke="#455a64" stroke-width="5"/>
  <text x="410" y="392" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#37474f">物体壁面</text>
  <line x1="20" y1="380" x2="700" y2="380" stroke="#546e7a" stroke-width="4" marker-end="url(#p)"/>
  <text x="360" y="350" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#37474f">来流 U∞</text>
  <g stroke="#1565c0" stroke-width="5" marker-end="url(#p)">
    <line x1="315" y1="250" x2="430" y2="250"/><line x1="315" y1="300" x2="430" y2="300"/><line x1="315" y1="350" x2="430" y2="350"/>
    <line x1="315" y1="410" x2="430" y2="410"/><line x1="315" y1="460" x2="430" y2="460"/><line x1="315" y1="510" x2="430" y2="510"/>
    <line x1="510" y1="250" x2="395" y2="250"/><line x1="510" y1="300" x2="395" y2="300"/><line x1="510" y1="350" x2="395" y2="350"/>
    <line x1="510" y1="410" x2="395" y2="410"/><line x1="510" y1="460" x2="395" y2="460"/><line x1="510" y1="510" x2="395" y2="510"/>
  </g>
  <text x="205" y="600" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1565c0">压力 p：各向异性，法向作用</text>
  <g stroke="#ef6c00" stroke-width="4" marker-end="url(#v)">
    <line x1="470" y1="275" x2="545" y2="250"/><line x1="485" y1="350" x2="560" y2="350"/><line x1="490" y1="440" x2="565" y2="470"/>
  </g>
  <text x="550" y="545" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#ef6c00">壁面剪切 τ：切向作用</text>
  <rect x="825" y="140" width="325" height="130" rx="18" fill="#e3f2fd" stroke="#42a5f5" stroke-width="3"/>
  <text x="987" y="183" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#0d47a1">Fpressure</text>
  <text x="987" y="224" text-anchor="middle" font-family="Consolas, monospace" font-size="23" fill="#0d47a1">= −∫ p n dA</text>
  <rect x="825" y="310" width="325" height="130" rx="18" fill="#fff3e0" stroke="#ffa726" stroke-width="3"/>
  <text x="987" y="353" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#e65100">Fviscous</text>
  <text x="987" y="394" text-anchor="middle" font-family="Consolas, monospace" font-size="23" fill="#e65100">= ∫ τw dA</text>
  <rect x="825" y="485" width="325" height="145" rx="18" fill="#ede7f6" stroke="#9575cd" stroke-width="4"/>
  <text x="987" y="530" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#4527a0">Ftotal</text>
  <text x="987" y="572" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#4527a0">= Fpressure + Fviscous</text>
  <line x1="745" y1="340" x2="815" y2="240" stroke="#1565c0" stroke-width="5" marker-end="url(#p)"/>
  <line x1="745" y1="420" x2="815" y2="375" stroke="#ef6c00" stroke-width="5" marker-end="url(#v)"/>
  <line x1="760" y1="450" x2="815" y2="560" stroke="#6a1b9a" stroke-width="7" marker-end="url(#t)"/>
  <text x="600" y="678" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" fill="#455a64">检查：各分量之和应与总力一致；负号只表示力方向与所选正方向相反。</text>
</svg>
