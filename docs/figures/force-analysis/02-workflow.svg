<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Ansys Fluent 受力分析闭环</title>
  <desc id="desc">从物理问题到结果可信度检查的六步流程。</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102a43" flood-opacity="0.15"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607d8b"/></marker>
  </defs>
  <rect width="1400" height="820" fill="#f7f9fc"/>
  <text x="700" y="64" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#102a43">Fluent 受力分析的六步闭环</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" filter="url(#s)">
    <rect x="70" y="130" width="330" height="150" rx="22" fill="#e3f2fd" stroke="#42a5f5" stroke-width="3"/>
    <circle cx="120" cy="180" r="28" fill="#1976d2"/><text x="120" y="190" text-anchor="middle" font-size="28" fill="white" font-weight="700">1</text>
    <text x="160" y="190" font-size="25" font-weight="700" fill="#0d47a1">定义问题</text>
    <text x="100" y="230" font-size="19" fill="#37474f">外流？雷诺数？稳态/瞬态？</text>
    <text x="100" y="260" font-size="19" fill="#37474f">需要总力、力矩还是系数？</text>
    <rect x="535" y="130" width="330" height="150" rx="22" fill="#e8f5e9" stroke="#66bb6a" stroke-width="3"/>
    <circle cx="585" cy="180" r="28" fill="#2e7d32"/><text x="585" y="190" text-anchor="middle" font-size="28" fill="white" font-weight="700">2</text>
    <text x="625" y="190" font-size="25" font-weight="700" fill="#1b5e20">几何与网格</text>
    <text x="565" y="230" font-size="19" fill="#37474f">域尺度、边界层、y+</text>
    <text x="565" y="260" font-size="19" fill="#37474f">壁面网格决定表面力精度</text>
    <rect x="1000" y="130" width="330" height="150" rx="22" fill="#fff3e0" stroke="#ffa726" stroke-width="3"/>
    <circle cx="1050" cy="180" r="28" fill="#ef6c00"/><text x="1050" y="190" text-anchor="middle" font-size="28" fill="white" font-weight="700">3</text>
    <text x="1090" y="190" font-size="25" font-weight="700" fill="#e65100">物理与收敛</text>
    <text x="1030" y="230" font-size="19" fill="#37474f">模型、入口/出口、初始条件</text>
    <text x="1030" y="260" font-size="19" fill="#37474f">残差 + 关键量双判据</text>
    <rect x="1000" y="485" width="330" height="150" rx="22" fill="#ede7f6" stroke="#9575cd" stroke-width="3"/>
    <circle cx="1050" cy="535" r="28" fill="#5e35b1"/><text x="1050" y="545" text-anchor="middle" font-size="28" fill="white" font-weight="700">4</text>
    <text x="1090" y="545" font-size="25" font-weight="700" fill="#4527a0">定义力报告</text>
    <text x="1030" y="585" font-size="19" fill="#37474f">参考值、方向、中心、wall zone</text>
    <text x="1030" y="615" font-size="19" fill="#37474f">Pressure / Viscous / Total</text>
    <rect x="535" y="485" width="330" height="150" rx="22" fill="#fce4ec" stroke="#ec407a" stroke-width="3"/>
    <circle cx="585" cy="535" r="28" fill="#ad1457"/><text x="585" y="545" text-anchor="middle" font-size="28" fill="white" font-weight="700">5</text>
    <text x="625" y="545" font-size="25" font-weight="700" fill="#880e4f">读取结果</text>
    <text x="565" y="585" font-size="19" fill="#37474f">系数曲线、矢量、表面量</text>
    <text x="565" y="615" font-size="19" fill="#37474f">检查符号与力分解闭合</text>
    <rect x="70" y="485" width="330" height="150" rx="22" fill="#e0f7fa" stroke="#26c6da" stroke-width="3"/>
    <circle cx="120" cy="535" r="28" fill="#00838f"/><text x="120" y="545" text-anchor="middle" font-size="28" fill="white" font-weight="700">6</text>
    <text x="160" y="545" font-size="25" font-weight="700" fill="#006064">可信度验收</text>
    <text x="100" y="585" font-size="19" fill="#37474f">网格/域/时间步无关性</text>
    <text x="100" y="615" font-size="19" fill="#37474f">量级与趋势合理、资料可追溯</text>
  </g>
  <g stroke="#607d8b" stroke-width="5" fill="none" marker-end="url(#a)">
    <path d="M400 205 L525 205"/><path d="M865 205 L990 205"/>
    <path d="M1165 290 L1165 475"/>
    <path d="M990 560 L875 560"/><path d="M525 560 L410 560"/>
    <path d="M235 475 L235 290"/>
  </g>
  <rect x="330" y="700" width="740" height="70" rx="16" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="700" y="744" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" fill="#795548">核心原则：力报告不是“点一下就有答案”，而是定义、收敛与验证共同产生的结果。</text>
</svg>
